  <section class="interactive card-stunt" aria-labelledby="stunt-title" data-stunt>
    <div class="interactive-head">
      <h3 id="stunt-title">Flip the card section</h3>
      <p>Each square is one student holding a card. Pick a message to flip the section on cue, or tap single cards to make your own.</p>
    </div>
    <div class="stunt-stands" aria-hidden="true"></div>
    <div class="stunt-controls" role="group" aria-label="Card display message" hidden>
      <button type="button" data-word="GT" aria-pressed="false">GT</button>
      <button type="button" data-word="TECH" aria-pressed="false">TECH</button>
      <button type="button" data-word="WAVE" aria-pressed="false">Wave</button>
      <button type="button" data-word="" class="stunt-reset">Cards down</button>
    </div>
    <p class="stunt-status" aria-live="polite"><noscript>Turn on JavaScript to flip the cards.</noscript></p>
  </section>
